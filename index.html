<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>30. Kat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Oswald:wght@400;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen game board — illustrated apartment scene + actions on the left, survivor's notebook (stats, building, journal) on the right */
:root{
  --night:#0d0e10; --panel:#16181b; --panel2:#1f2226; --line:#2c3035;
  --ink:#e4ded2; --muted:#8e9196; --lamp:#d9a441; --rot:#8fa86a;
  --blood:#c2412f; --water:#5e9fc4; --mood:#9c8bc0; --wood:#a97a4e;
  --display:'Oswald','Arial Narrow',Impact,sans-serif; --type:'Courier Prime','Courier New',monospace;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(1200px 600px at 30% -10%,#1d1a17 0%,var(--night) 60%) fixed,var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:46px;line-height:1;margin:0;letter-spacing:1px;text-transform:uppercase}
h1 small{font-family:var(--type);font-weight:400;font-size:16px;color:var(--muted);margin-left:10px;letter-spacing:0;text-transform:none}
.daybox{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.day{font-family:var(--display);font-size:30px;line-height:1}
.day span{color:var(--muted);font-size:20px}
.ap{display:flex;gap:6px;align-items:center}
.ap .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--lamp);transition:background .3s,box-shadow .3s}
.pip.on{background:var(--lamp);box-shadow:0 0 10px rgba(242,180,90,.5)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.scene{position:relative;border-radius:14px;overflow:hidden;border:3px solid #0b0f18;background:#0b0f18;line-height:0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.scene svg{width:100%;height:auto;display:block}
.scene .cap{position:absolute;left:10px;top:10px;line-height:1.2;font-family:var(--display);font-size:17px;background:rgba(10,13,22,.72);color:var(--ink);padding:3px 10px;border-radius:8px}
.scene canvas{display:block;width:100%;touch-action:none;cursor:grab}
.scene canvas:active{cursor:grabbing}
.dragtip{position:absolute;right:10px;bottom:10px;line-height:1.2;font-size:12px;color:var(--ink);background:rgba(10,13,22,.6);padding:3px 8px;border-radius:8px;pointer-events:none;transition:opacity .6s}
.scene.dragged .dragtip{opacity:0}
.scene.hurt{animation:shake .45s}
.scene.hurt::after{content:"";position:absolute;inset:0;background:rgba(224,97,75,.35);animation:flash .5s forwards;pointer-events:none}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes flash{to{opacity:0}}
.pop{position:absolute;line-height:1.2;font-family:var(--display);font-size:22px;padding:2px 10px;border-radius:10px;background:rgba(10,13,22,.8);pointer-events:none;animation:popup 1.8s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.pop.up{color:var(--rot)}.pop.down{color:var(--blood)}
@keyframes popup{0%{opacity:0;margin-top:10px}12%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-34px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 10px;line-height:1.1}
.hint{font-size:13px;color:var(--muted);margin:0}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.actions{grid-template-columns:minmax(0,1fr)}}
.act{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:transform .08s,border-color .15s,background .15s;min-width:0}
.act:hover:not(:disabled){border-color:var(--lamp);background:#272a2f}
.act:active:not(:disabled){transform:translateY(1px)}
.act:disabled{cursor:not-allowed;opacity:.48}
.ico{width:38px;height:38px;border-radius:10px;background:#101215;display:grid;place-items:center;color:var(--lamp)}
.act.special .ico{color:var(--rot)}
.ico svg{width:24px;height:24px}
.act .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.act .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.act b{font-weight:700;font-size:15px}
.act .cost{flex:none;font-size:12px;color:var(--lamp);white-space:nowrap;letter-spacing:1px}
.act .d{font-size:13px;color:var(--muted)}
.act .no{font-size:12px;color:var(--blood)}
.act.special{border-color:#4a5a3a}
.endbtn{margin-top:10px;width:100%;background:var(--lamp);color:#23190b;border:0;border-radius:10px;padding:12px;font-weight:700;font-size:16px;cursor:pointer}
.endbtn:hover{filter:brightness(1.06)}
.endbtn:disabled{opacity:.5;cursor:default}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center}
.bar svg{width:20px;height:20px}
.bar .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bar .row b{font-variant-numeric:tabular-nums}
.track{height:10px;background:#0b0c0e;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;border-radius:6px;transition:width .5s ease}
.bar.low .row span{color:var(--blood)}
.bar.low svg{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.35}}
.inv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.item{background:var(--panel2);border-radius:8px;padding:6px 4px;text-align:center}
.item b{display:block;font-family:var(--display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.item span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lasts{margin-top:10px;font-size:13px;color:var(--muted)}
.lasts b{color:var(--ink)}
.notebook{display:flex;gap:14px}
.tower{flex:none;width:92px}
.tower svg{width:100%;height:auto;display:block}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto;min-width:0;flex:1}
.log li{font-family:var(--type);font-size:13.5px;border-left:3px solid var(--line);padding:1px 0 1px 9px}
.log li i{font-style:normal;color:var(--muted);font-size:12px;margin-right:4px}
.log li.good{border-color:var(--rot)}
.log li.bad{border-color:var(--blood)}
.log li.story{border-color:var(--lamp)}
.foot{display:flex;justify-content:flex-end}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted);cursor:pointer;font-size:13px}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.ghost.warn{border-color:var(--blood);color:var(--blood)}
/* modal */
.veil{position:fixed;inset:0;background:rgba(6,9,16,.5);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;padding:22px;max-height:100%;overflow-y:auto;animation:pop .3s ease;box-shadow:0 20px 60px rgba(0,0,0,.5)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:.3}to{transform:none;opacity:1}}
.card .art{margin:-22px -22px 14px;line-height:0;border-radius:16px 16px 0 0;overflow:hidden;background:#0b0f18}
.card .art svg{width:100%;height:auto;display:block}
.card .eyebrow{font-family:var(--type);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--lamp)}
.card h3{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.05;margin:4px 0 10px;text-wrap:balance}
.card p{margin:0 0 10px}
.card ul.lines{margin:0 0 12px;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.chip{font-size:12.5px;padding:3px 8px;border-radius:20px;background:var(--panel2);font-variant-numeric:tabular-nums}
.chip.up{color:var(--rot)}.chip.down{color:var(--blood)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choice{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--lamp)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice b{display:block}
.choice span{font-size:13px;color:var(--muted)}
.choice.primary{background:var(--lamp);color:#23190b;border-color:var(--lamp)}
.choice.primary span{color:#4a3714}
.stars{font-size:28px;color:var(--lamp);letter-spacing:4px}
/* scene animation */
#scn *{transition:fill 1.2s ease, stop-color 1.2s ease, opacity 1.2s ease}
#scn stop{transition:stop-color 1.2s ease}
.smoke circle{animation:rise 9s linear infinite}
@keyframes rise{from{transform:translateY(40px) scale(.6);opacity:0}15%{opacity:.6}to{transform:translateY(-200px) translateX(30px) scale(1.4);opacity:0}}
.plume{animation:sway 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}
@keyframes sway{to{transform:skewX(-8deg) scaleY(1.05)}}
.rain line{animation:fall .6s linear infinite}
@keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(40px)}}
.clouds{animation:drift 80s linear infinite}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(120px)}}
.heli{animation:fly 14s linear infinite}
@keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(320px)}}
.rotor{animation:spin .15s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{50%{transform:scaleX(.15)}}
.flame{animation:flick 1.1s ease-in-out infinite alternate;transform-origin:center bottom;transform-box:fill-box}
@keyframes flick{from{transform:scaleY(1)}to{transform:scaleY(.8) skewX(5deg)}}
.breathe{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes breathe{50%{transform:scaleY(1.018)}}
.shuffle{animation:shuf 2.4s ease-in-out infinite alternate}
@keyframes shuf{to{transform:translateX(6px)}}
.glowp{animation:glowp 2.5s ease-in-out infinite alternate}
@keyframes glowp{to{opacity:.75}}
.fireflick{animation:flick .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>30. Kat <small>salgının ilk günleri</small></h1>
    <div class="daybox">
      <div class="day" id="dayLbl">Gün 1 <span>/ 30</span></div>
      <div class="ap" id="apBox" aria-label="Kalan enerji"></div>
    </div>
  </header>

  <div class="grid">
    <div class="col">
      <div class="scene" id="scene"></div>
      <section class="panel">
        <h2>Bugün ne yapacaksın?</h2>
        <p class="hint" id="apHint">Her gün 3 enerjin var. Bitince günü kapat.</p>
        <div class="actions" id="actions" style="margin-top:10px"></div>
        <button class="endbtn" id="endDay">Günü bitir, akşam yemeğine geç</button>
      </section>
    </div>

    <div class="col">
      <section class="panel">
        <h2>Durumun</h2>
        <div class="bars" id="bars"></div>
        <div class="inv" id="inv"></div>
        <p class="lasts" id="lasts"></p>
      </section>
      <section class="panel">
        <h2>Günlük</h2>
        <div class="notebook">
          <div class="tower" id="tower" aria-label="Bina"></div>
          <ul class="log" id="log"></ul>
        </div>
      </section>
      <div class="foot"><button class="ghost" id="restart">Baştan başla</button></div>
    </div>
  </div>
</div>
<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const R=Math.random;
const rint=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LAST_DAY=30;
const SAVE_KEY='kat30-save-v1';

/* ---------- icons ---------- */
const I=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS={
  kitchen:I('<rect x="4" y="3" width="16" height="18" rx="2"/><line x1="4" y1="11" x2="20" y2="11"/><line x1="9" y1="6.5" x2="9" y2="8"/><line x1="9" y1="14" x2="9" y2="16.5"/>'),
  tub:I('<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9 14a3 3 0 0 0 3 3"/>'),
  rain:I('<path d="M7 15a4 4 0 0 1 .5-8A5.5 5.5 0 0 1 18 8.5 3.5 3.5 0 0 1 17.5 15z"/><line x1="8" y1="18" x2="7" y2="21"/><line x1="12" y1="18" x2="11" y2="21"/><line x1="16" y1="18" x2="15" y2="21"/>'),
  barricade:I('<rect x="5" y="3" width="14" height="18" rx="1"/><line x1="2" y1="8" x2="22" y2="12"/><line x1="2" y1="15" x2="22" y2="11"/>'),
  peek:I('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>'),
  flat:I('<path d="M4 21V4h10v17"/><path d="M14 8l5-2v15"/><line x1="2" y1="21" x2="22" y2="21"/><circle cx="11.5" cy="13" r=".8" fill="currentColor"/>'),
  radio:I('<rect x="3" y="9" width="18" height="12" rx="2"/><line x1="7" y1="9" x2="17" y2="3"/><circle cx="8.5" cy="15" r="2.5"/><line x1="14" y1="13" x2="18" y2="13"/><line x1="14" y1="17" x2="18" y2="17"/>'),
  sos:I('<line x1="5" y1="22" x2="5" y2="3"/><path d="M5 4h12l-3 4 3 4H5"/>'),
  rest:I('<path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/>'),
  read:I('<path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><line x1="12" y1="6" x2="12" y2="20"/>'),
  med:I('<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M9 6V4h6v2"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/>'),
};
const BAR_ICONS={
  hp:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="#e0614b"/>',
  food:'<rect x="6" y="5" width="12" height="15" rx="2" fill="#f2b45a"/><rect x="6" y="9" width="12" height="6" fill="#b5701f"/>',
  hyd:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z" fill="#6db6e6"/>',
  mor:'<circle cx="12" cy="12" r="8.5" fill="#b99be6"/><circle cx="9" cy="10.5" r="1.2" fill="#2a1f40"/><circle cx="15" cy="10.5" r="1.2" fill="#2a1f40"/><path d="M8.5 14.5q3.5 3 7 0" stroke="#2a1f40" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
  bar:'<rect x="4" y="4" width="16" height="16" rx="1" fill="#7c5a3c"/><rect x="2" y="8" width="20" height="4" fill="#c48f5d" transform="rotate(-10 12 10)"/><rect x="2" y="13" width="20" height="4" fill="#c48f5d" transform="rotate(8 12 15)"/>',
};

/* ---------- data ---------- */
const KITCHEN=[
  {t:'Bakliyat dolabının arkasında konserveler buldun.',g:{meals:3}},
  {t:'Üst rafta unutulmuş erişte paketleri.',g:{meals:2}},
  {t:'Çekmecede mumlar ve bir çakmak.',g:{candle:3}},
  {t:'Banyo dolabında ağrı kesici ve sargı bezi.',g:{med:1}},
  {t:'Buzdolabındaki taze yiyecekleri hemen tükettin, gerisini sakladın.',g:{meals:2},spoil:true},
  {t:'Hurdalık çekmecesinde yedek piller.',g:{bat:2}},
];
const FLATS=[
  {go:'30B dairesine gir',d:'Yaşlı Kaya çiftinin evi. Sessiz görünüyor.',risk:.15,loot:{meals:5,water:6,med:1},
   ok:'Kaya çiftinin dairesi boştu. Kilerleri hâlâ doluydu.',hit:'Mutfakta devrilen tencere sesine biri geldi, kaçmak zorunda kaldın.'},
  {go:'30A dairesine gir',d:'Kapısı aralık. İçeride ne var bilinmez.',risk:.3,loot:{meals:4,bat:2,furniture:2},
   ok:'30A boştu. Pil, konserve ve sökülebilir raflar buldun.',hit:'Banyodan bir şey fırladı. Rafları sürükleyerek kaçtın.'},
  {go:'30C dairesine gir',d:'Geceleri içeriden tırmalama sesi geliyor.',risk:.6,loot:{meals:6,water:8,med:1},
   ok:'30C’deki adam artık insan değildi ama yatak odasına kilitliydi. Mutfağı senin oldu.',hit:'30C’deki adam yatak odasından çıktı. Boğuşma oldu.'},
];
const NAMES={meals:'öğün',water:'L su',med:'ilaç',bat:'pil',candle:'mum',furniture:'eşya'};

function fresh(){
  return {day:1,ap:3,maxAp:3,hp:100,food:75,hyd:75,mor:70,bar:0,
    water:10,meals:8,med:1,bat:2,candle:1,furniture:4,
    kitchen:shuffle(KITCHEN.map(k=>({...k,g:{...k.g}}))),flats:0,tubFills:0,
    waterOn:true,powerOn:true,knowsRoof:false,sos:false,peeked:false,noise:0,hall:2,
    rainToday:false,rainTomorrow:false,rainGot:false,fire:false,
    womanDone:false,womanHelpDay:0,giftDone:false,spot:'sofa',
    phase:'intro',log:[],ending:null,cause:''};
}
let s;

function gain(o){
  const parts=[];
  for(const k in o){ if(!o[k]) continue; s[k]+=o[k]; parts.push((o[k]>0?'+':'')+o[k]+' '+NAMES[k]); }
  return parts.join(', ');
}
function log(t,k=''){ s.log.unshift({d:s.day,t,k}); if(s.log.length>80) s.log.length=80; }
function fix(){ s.hp=clamp(s.hp);s.food=clamp(s.food);s.hyd=clamp(s.hyd);s.mor=clamp(s.mor);s.bar=clamp(s.bar);
  s.water=Math.max(0,Math.round(s.water*10)/10); s.meals=Math.max(0,Math.round(s.meals*10)/10); }

/* ---------- actions ---------- */
const ACTIONS=[
  {id:'kitchen',spot:'shelf',name:'Mutfağı ve dolapları ara',cost:1,desc:'Evde unuttuğun bir şey kalmış olabilir.',
    why:()=>s.kitchen.length?null:'Evde aranmadık yer kalmadı.',

  {id:'tub',spot:'shelf',name:'Küveti ve kapları doldur',cost:1,desc:'Musluklar akarken su depola. +15 L su',

  {id:'rain',spot:'window',name:'Balkonda yağmur suyu topla',cost:1,desc:'Kapları balkona diz. +8 L su',

  {id:'barricade',spot:'door',name:'Kapıya barikat kur',cost:1,desc:'Mobilyaları kapıya daya. +25 barikat. Biraz gürültü yapar.',

    run:()=>{s.furniture--;s.bar+=25;s.noise+=1;
      return[pick(['Kitaplığın raflarını söküp kapıya çaktın.','Sandalyeyi kapı koluna sıkıştırdın.','Masayı yan yatırıp kapıya dayadın.','Gardırobu sürükleyip kapının önüne devirdin.'])+' (+25 barikat)','good'];}},
  {id:'peek',spot:'door',name:'Gözetleme deliğinden bak',cost:1,desc:'Koridoru kontrol et. Bugünkü dış çıkışlar daha güvenli olur.',
    why:()=>s.peeked?'Bugün zaten baktın.':null,
    run:()=>{s.peeked=true;const h=s.hall;
      const t=h===0?'Koridor boş. Sadece titreyen bir floresan.':h<=2?`Koridorda ${h} tane var. Ağır ağır dolaşıyorlar.`:h<=5?`Koridorda ${h} tane. Biri kapına çok yakın.`:'Koridor dolu. Saymayı bıraktın.';
      showPeek(t);

  {id:'flat',spot:'door',name:()=>s.flats<3?FLATS[s.flats].go:'29. kata in',cost:2,

    special:true,why:()=>s.hp<35?'Bu kadar yaralıyken dışarı çıkamazsın.':null,
    run:()=>{
      const f=s.flats<3?FLATS[s.flats]:null;
      const risk=((f?f.risk:.4)+s.hall*.03)*(s.peeked?.5:1);
      const hit=R()<risk; s.noise+=1;
      let loot=f?{...f.loot}:{meals:rint(0,3),water:rint(0,4),med:R()<.2?1:0};
      if(hit) for(const k in loot) loot[k]=Math.floor(loot[k]/2);
      if(f) s.flats++;
      let t=f?(hit?f.hit:f.ok):(hit?'29. katta biri seni fark etti, merdivenlere koştun.':'29. katta açık bir daire buldun.');
      const g=gain(loot); t+=g?` (${g})`:' Eli boş döndün.';
      if(hit){const dmg=rint(18,30);s.hp-=dmg;s.mor-=6;t+=` Yaralandın: -${dmg} sağlık.`;return[t,'bad'];}
      return[t,'good'];}},
  {id:'radio',spot:'sofa',name:'Radyoyu dinle',cost:1,desc:'1 pil harcar. Moral verir, haber getirebilir.',
    why:()=>s.bat<=0?'Pilin kalmadı.':null,
    run:()=>{s.bat--;
      if(s.day>=10&&!s.knowsRoof){s.knowsRoof=true;s.mor+=15;
        return['Radyo: “...yüksek binalarda mahsur kalanlar, çatıya büyük harflerle SOS yazın. Tahliye helikopterleri 30. günde çatıları tarayacak...” Artık bir hedefin var.','story'];}
      if(s.knowsRoof){s.mor+=10;return['Tahliye yayını tekrar ediliyor: 30. gün, çatı, SOS.',''];}
      s.mor+=10;
      return[pick(['Radyo: “...evlerinizde kalın, kapılarınızı kilitleyin. Hastaneler kapasitesini aştı...”','Radyo: “...ısırılan kişilerle temas etmeyin, belirtiler birkaç saat içinde başlıyor...”','Çoğunlukla parazit. Ama bir insan sesi duymak iyi geldi.','Radyo: “...yetkililer yeni bir açıklama yapacak. Frekansı açık tutun...”']),''];}},
  {id:'sos',spot:'door',name:'Çatıya çık, SOS yaz',cost:3,desc:'Çarşaflarla çatıya dev bir SOS yaz. Merdiven boşluğu tehlikeli.',
    special:true,hidden:()=>!s.knowsRoof,why:()=>s.sos?'SOS çatıda yazılı.':s.hp<40?'Bu kadar yaralıyken çıkamazsın.':null,
    run:()=>{s.sos=true;s.noise+=1;s.mor+=15;
      const hit=R()<(.35+s.hall*.03)*(s.peeked?.5:1);
      if(hit){const d=rint(15,25);s.hp-=d;return[`Merdivende biri seni yakaladı ama kurtuldun (-${d} sağlık). Çatıya kocaman bir SOS yazdın.`,'bad'];}
      return['Çarşafları ve havluları çatıya serip kocaman bir SOS yazdın. Gökyüzünden görünür.','story'];}},
  {id:'rest',spot:'sofa',name:'Dinlen',cost:1,desc:'Kanepede uzan, gücünü topla. +8 sağlık, +4 moral',
    run:()=>{s.hp+=8;s.mor+=4;return['Biraz uyudun. Rüyanda her şey normaldi.',''];}},
  {id:'read',spot:'sofa',name:'Kitap oku, günlük yaz',cost:1,desc:'Aklını meşgul et. +10 moral',
    run:()=>{s.mor+=10;return[pick(['Raftan eski bir roman aldın, bir süre başka bir yerdeydin.','Günlüğüne bugünü yazdın. Yazmak iyi geldi.','Duvardaki fotoğraflara bakıp eski günleri düşündün.']),''];}},
  {id:'med',spot:'sofa',name:'İlaç kullan',cost:0,desc:'Yaralarını sar. +30 sağlık. Enerji harcamaz.',
    why:()=>s.med<=0?'İlacın yok.':s.hp>=100?'Zaten sağlıklısın.':null,
    run:()=>{s.med--;s.hp+=30;return['Yaralarını temizleyip sardın. (+30 sağlık)','good'];}},
];
const nm=a=>typeof a.name==='function'?a.name():a.name;
const ds=a=>typeof a.desc==='function'?a.desc():a.desc;

const TRACK=[['hp','sağlık'],['mor','moral'],['bar','barikat'],['water','L su'],['meals','öğün'],['med','ilaç'],['bat','pil'],['candle','mum']];
function doAction(a){
  if(s.phase!=='day'||s.ap<a.cost) return;
  if(a.why&&a.why()) return;
  const before={};TRACK.forEach(([k])=>before[k]=s[k]);
  s.ap-=a.cost; s.spot=a.spot||'sofa';
  const [t,k]=a.run(); fix(); log(t,k);
  if(s.hp<=0){ s.cause='Aldığın yaralar çok ağırdı.'; return lose(); }
  save(); render();
  const diffs=TRACK.map(([k,l])=>[Math.round((s[k]-before[k])*10)/10,l]).filter(([d])=>d);
  popups(diffs);
  if(s.hp<before.hp) hurt();
}
function popups(diffs){
  const sc=$('#scene');
  const ps=personScreen();
  diffs.forEach(([d,l],i)=>{
    const p=document.createElement('div');p.className='pop '+(d>0?'up':'down');
    p.textContent=(d>0?'+':'')+String(d).replace('.',',')+' '+l;
    p.style.left=ps.x+'%';p.style.top=(ps.y+i*9)+'%';p.style.animationDelay=(i*.18)+'s';
    sc.appendChild(p);setTimeout(()=>p.remove(),2400+i*180);
  });
}
function hurt(){if(G)G.hurt=1;const sc=$('#scene');sc.classList.remove('hurt');void sc.offsetWidth;sc.classList.add('hurt');setTimeout(()=>sc.classList.remove('hurt'),600);}

/* ---------- night ---------- */
const RATIONS=[
  {label:'Doyasıya',meals:1.5,water:3,food:35,hyd:38,mor:5,sub:'1,5 öğün · 3 L su · moral artar'},
  {label:'Normal',meals:1,water:2,food:25,hyd:30,mor:0,sub:'1 öğün · 2 L su · tokluk ve su dengede kalır'},
  {label:'Kısıtlı',meals:.5,water:1,food:12,hyd:15,mor:-4,sub:'Yarım öğün · 1 L su · stok uzar ama vücudun zayıflar'},
  {label:'Hiçbir şey',meals:0,water:0,food:0,hyd:0,mor:-8,sub:'Bu gece aç ve susuz yat'},
];
function endDay(){
  if(s.phase!=='day') return;
  s.phase='ration'; s.spot='sofa'; render();
  modal({eyebrow:`Gün ${s.day} · akşam`,title:'Bu akşam ne kadar yiyeceksin?',art:artDinner(),
    body:`<p>Kilerde <b>${fmt(s.meals)} öğün</b> yemek ve <b>${fmt(s.water)} L</b> su var. ${LAST_DAY-s.day} gün daha dayanman gerek.</p>`,
    choices:RATIONS.map((r,i)=>({label:r.label,sub:r.sub,primary:i===1,
      disabled:s.meals<r.meals||s.water<r.water,fn:()=>night(r)}))});
}
function fmt(n){return String(n).replace('.',',');}

function night(r){
  const before={hp:s.hp,food:s.food,hyd:s.hyd,mor:s.mor,bar:s.bar};
  const lines=[];
  s.meals-=r.meals; s.water-=r.water;
  s.food+=r.food; s.hyd+=r.hyd; s.mor+=r.mor;
  s.food-=25; s.hyd-=30; s.mor-=3; fix();
  if(s.food<=0){s.hp-=15;lines.push(['Açlıktan midene kramplar giriyor.','bad']);}
  if(s.hyd<=0){s.hp-=20;lines.push(['Dudakların çatladı, başın dönüyor. Susuzluk seni tüketiyor.','bad']);}
  else if(s.food<20||s.hyd<20){s.hp-=5;}
  if(s.food>=50&&s.hyd>=50) s.hp+=6;
  if(!s.powerOn){ if(s.candle>0){s.candle--;lines.push(['Bir mum yaktın, karanlık biraz daha katlanılır oldu.',''])} else {s.mor-=6;lines.push(['Mumun kalmadı. Gece zifiri karanlıktı.','bad'])} }
  s.noise=Math.max(0,s.noise-1);
  s.hall=clamp(s.hall+rint(-1,2)+(s.noise>2?1:0),0,8);
  fix();
  s.phase='event'; render();
  const ev=pickEvent();
  let art='';
  const finish=()=>{fix();
    if(s.hp<=0){ s.cause=s.hyd<=0?'Susuzluk seni tüketti.':s.food<=0?'Açlık seni tüketti.':'Gecenin yaraları çok ağırdı.'; return lose(); }
    lines.forEach(([t,k])=>log(t,k));
    if(s.day>=LAST_DAY) return win();
    morning(lines,before,art);
  };
  if(!ev){ finish(); return; }
  art=ev.art?(typeof ev.art==='function'?ev.art():ev.art):'';
  if(ev.choices){
    modal({eyebrow:`Gün ${s.day} · gece`,title:ev.title,art,body:`<p>${ev.text}</p>`,
      choices:ev.choices.map(c=>({label:c.label,sub:c.sub,disabled:c.ok&&!c.ok(),
        fn:()=>{const res=c.fn();lines.unshift(res);art='';finish();}}))});
  } else { lines.unshift(ev.fn()); if(ev.artAfter) art=ev.artAfter(); finish(); }
}

function pickEvent(){
  const d=s.day;
  if(d===2) return {fn:()=>['Musluktan gelen su bulanıklaştı, basınç düşüyor. Küveti doldurmanın tam zamanı.','story']};
  if(d===3) return {fn:()=>{s.waterOn=false;return['Gece musluklar hırıldadı ve sustu. Şebeke suyu kesildi.','story']}};
  if(d===5) return {art:()=>artBlackout(),fn:()=>{s.powerOn=false;return['Saat 02.14. Buzdolabının uğultusu kesildi. Bütün şehirde elektrik gitti.','story']}};
  if(d===8) return {title:'Aşağıda yangın var',art:()=>artFire(),
    text:'Merdiven boşluğundan duman yükseliyor. 11. katta yangın çıkmış. Aradaki 19 kat ölüler için uzun bir yol, duman içinse değil.',
    choices:[
      {label:'Islak havlularla kapı aralıklarını kapat',sub:'4 L su harcar, dumanı dışarıda tutar',ok:()=>s.water>=4,
        fn:()=>{s.fire=true;s.water-=4;return['Havluları ıslatıp kapının altına sıkıştırdın. Duman içeri girmedi. Yangın 4 L suya mal oldu.','story'];}},
      {label:'Pencereleri aç, havalandır',sub:'Su harcamaz ama dumandan etkilenirsin',
        fn:()=>{s.fire=true;s.hp-=12;s.mor-=5;return['Bütün gece öksürdün. Sabah gözlerin hâlâ yanıyordu. (-12 sağlık)','bad'];}},
    ]};
  if(d===11) return {fn:()=>{s.rainTomorrow=true;return['Gökyüzü kararıyor. Yarın yağmur yağacak, balkona kap koyabilirsin.','story']}};
  if(d===13) return {art:()=>artHeli(false),fn:()=>{s.mor+=5;return[s.knowsRoof?'Bir helikopter binanın üstünden geçti. Radyo haklıydı, çatıları tarıyorlar.':'Bir helikopter binanın üstünden geçip gitti. Radyoda bir şey duyurmuş olabilirler.','story']}};
  if(d===19&&!s.womanDone) return womanEvent();
  if(d===24) return {art:()=>peepSVG(12),fn:()=>{
    if(s.bar>=50){s.bar-=35;s.mor-=5;return['Koridorda yüzlerce ayak sesi vardı. Sürü kapına yüklendi ama barikat dayandı.','story'];}
    s.hp-=35;s.bar=0;s.mor-=15;return['Sürü geçti. Barikatın yetersizdi; kapı kırıldı, sabaha kadar mutfakta saklandın. (-35 sağlık)','bad'];}};
  if(s.womanHelpDay&&!s.giftDone&&d>=s.womanHelpDay+4) return {fn:()=>{s.giftDone=true;gain({meals:4});return['Sabah kapının önünde bir paket buldun: 4 konserve ve bir not. “Teşekkürler. 27. kattan Elif.”','good']}};
  const p=.1+s.hall*.05+s.noise*.08-(s.peeked?.1:0);
  if(R()<p) return {art:()=>peepSVG(Math.max(1,s.hall)),fn:()=>{
    if(s.bar>=20){const l=rint(10,18);s.bar-=l;s.mor-=4;return[`Gece kapı tırmalandı. Barikat dayandı ama zarar gördü. (-${l} barikat)`,'bad'];}
    s.hp-=20;s.mor-=10;return['Kapı aralandı. İçeri giren şeyi zar zor dışarı ittin. (-20 sağlık) Barikat kurmalısın.','bad'];}};
  const pool=[[40,'quiet'],[15,'nightmare'],[d>4&&!s.rainTomorrow?15:0,'rain'],[10,'shots'],[d>=5&&!s.womanDone?15:0,'woman'],[5,'pack']];
  let tot=pool.reduce((a,b)=>a+b[0],0),x=R()*tot,k='quiet';
  for(const [w,id] of pool){ if(x<w){k=id;break;} x-=w; }
  if(k==='quiet') return {fn:()=>{s.mor+=3;return['Sakin bir geceydi. Uzun zamandır ilk kez deliksiz uyudun.','']}};
  if(k==='nightmare') return {fn:()=>{s.mor-=8;return['Kâbuslarla uyandın. Kapının ardında birinin nefes aldığını duyar gibi oldun.','bad']}};
  if(k==='rain') return {fn:()=>{s.rainTomorrow=true;return['Bulutlar toplanıyor. Yarın yağmur var.','']}};
  if(k==='shots') return {fn:()=>{s.mor-=5;s.hall+=1;return['Aşağı katlardan silah sesleri geldi. Ardından uzun bir sessizlik.','bad']}};
  if(k==='woman') return womanEvent();
  return {fn:()=>{gain({meals:2});return['Rüzgâr üst kattan balkonuna bir alışveriş poşeti düşürdü. (+2 öğün)','good']}};
}
function womanEvent(){
  s.womanDone=true;
  return {title:'Kapıda biri var',art:()=>peepSVG(0,true),
    text:'Gece yarısı kapı hafifçe tıklatıldı. Gözetleme deliğinde bir kadın var. Fısıldıyor: “Lütfen... 27. kattan çıktım, iki gündür su içmedim. Sadece biraz su.”',
    choices:[
      {label:'Kapının altından 3 L su ver',sub:'Kapıyı açmadan yardım et',ok:()=>s.water>=3,
        fn:()=>{s.water-=3;s.mor+=8;s.womanHelpDay=s.day;return['Su şişesini kapının altından ittin. “Bunu unutmayacağım” dedi ve uzaklaştı.','good'];}},
      {label:'Sessiz kal, kapıyı açma',sub:'Riske girme',
        fn:()=>{s.mor-=12;return['Nefesini tuttun. Bir süre sonra ayak sesleri uzaklaştı. Bütün gece aklından çıkmadı.','bad'];}},
    ]};
}

function morning(lines,before,art){
  const nd=s.day+1;
  const labels={hp:'sağlık',food:'tokluk',hyd:'su',mor:'moral',bar:'barikat'};
  let chips='';
  for(const k in labels){const dv=Math.round(s[k]-before[k]); if(dv) chips+=`<span class="chip ${dv>0?'up':'down'}">${dv>0?'+':''}${dv} ${labels[k]}</span>`;}
  const warn=s.mor<20?'<p><b>Moralin çok düşük.</b> Bugün sadece 2 enerjin var.</p>':'';
  modal({eyebrow:'Gece geçti',title:`Gün ${nd} başlıyor`,art,
    body:(lines.length?`<ul class="lines">${lines.map(l=>`<li>${l[0]}</li>`).join('')}</ul>`:'')+(chips?`<div class="deltas">${chips}</div>`:'')+warn,
    choices:[{label:'Güne başla',primary:true,fn:()=>{
      const hpDrop=s.hp<before.hp;
      s.day=nd; s.maxAp=s.mor<20?2:3; s.ap=s.maxAp; s.peeked=false; s.rainGot=false;
      s.rainToday=s.rainTomorrow; s.rainTomorrow=false; s.phase='day'; s.spot='window';
      if(s.rainToday) log('Yağmur yağıyor. Balkona kap koymak için iyi bir gün.','story');
      save(); render(); if(hpDrop) hurt();}}]});
}

function lose(){
  s.phase='end'; s.ending='lose'; save(); render();
  modal({eyebrow:`Gün ${s.day}`,title:'Hayatta kalamadın',art:peepSVG(6),
    body:`<p>${s.cause}</p><p>30. katta <b>${s.day} gün</b> dayandın. Stok yönetimi ve barikat bir dahaki sefere fark yaratabilir.</p>`,
    choices:[{label:'Yeniden dene',primary:true,fn:restart}]});
}
function win(){
  s.phase='end'; s.ending=s.sos?'rescue':'survive'; save(); render();
  const stars=1+(s.sos?1:0)+(s.hp>=60?1:0);
  const body=s.sos
    ?`<p>Sabah pervane sesiyle uyandın. Helikopter çatıdaki SOS yazısının üstünde döndü ve indi. Merdivenleri son kez çıktın.</p><p><b>30 gün</b> dayandın ve kurtarıldın.</p>`
    :`<p>30. günün sonunda askerler binayı kat kat temizleyerek yukarı çıktı. Kapına ulaştıklarında hâlâ hayattaydın.</p><p>Hayatta kaldın. Radyoyu dinleyip çatıya SOS yazsaydın helikopterle kurtulabilirdin.</p>`;
  modal({eyebrow:'Gün 30 · son',title:s.sos?'Kurtarıldın!':'Hayatta kaldın',art:s.sos?artHeli(true):'',
    body:`<div class="stars" aria-label="${stars} yıldız">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>`+body+
      `<p class="hint">Kalan: ${fmt(s.meals)} öğün, ${fmt(s.water)} L su, ${s.hp} sağlık.</p>`,
    choices:[{label:'Yeniden oyna',primary:true,fn:restart}]});
}

/* ---------- modal ---------- */
function modal({eyebrow,title,body,choices,art}){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="veil"><div class="card" role="dialog" aria-modal="true" aria-labelledby="mt">
    ${art?`<div class="art">${art}</div>`:''}
    ${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h3 id="mt">${title}</h3>${body||''}
    <div class="choices"></div></div></div>`;
  const box=root.querySelector('.choices');
  choices.forEach(c=>{const b=document.createElement('button');b.className='choice'+(c.primary?' primary':'');
    b.disabled=!!c.disabled;b.innerHTML=`<b>${c.label}</b>${c.sub?`<span>${c.sub}${c.disabled?' · yetersiz stok':''}</span>`:''}`;
    b.onclick=()=>{root.innerHTML='';c.fn();};box.appendChild(b);});
  const f=box.querySelector('button:not(:disabled)'); if(f) f.focus();
}
function showPeek(t){
  setTimeout(()=>modal({eyebrow:'Gözetleme deliği',title:s.hall===0?'Koridor boş':`Koridorda ${s.hall>5?'çok sayıda':s.hall} zombi`,
    art:peepSVG(s.hall),body:`<p>${t}</p><p class="hint">Bugün dışarı çıkarsan yakalanma ihtimalin yarıya iner.</p>`,
    choices:[{label:'Kapıdan uzaklaş',primary:true,fn:()=>{}}]}),350);
}

/* ---------- illustrations ---------- */
let seed=11; const srnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
const INK='#1c1d24';
function zombie(x,y,sc,tint){
  // standing shambling figure, origin at feet
  const c=tint||'#93a57e';
  return `<g transform="translate(${x} ${y}) scale(${sc})"><g class="shuffle" style="animation-delay:${-(x%7)*.4}s">
    <g stroke="${INK}" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="0" y1="-40" x2="-2" y2="-14"/><line x1="-2" y1="-14" x2="-10" y2="0"/><line x1="-2" y1="-14" x2="7" y2="0"/>
      <path d="M-1 -34 L-14 -26 L-22 -28"/><path d="M-1 -34 L12 -28 L20 -31"/>
    </g>

const SPOT3={
  sofa:{path:[[3.0,-1.95],[1.0,-1.95]],p:[1.0,-2.62],ry:0,sit:true},
  shelf:{path:[[-3.55,-1.2]],p:[-3.55,-1.2],ry:-Math.PI/2},
  door:{path:[[-3.75,1.6]],p:[-3.75,1.6],ry:-Math.PI/2},
  window:{path:[[3.45,-1.9],[3.45,-3.35]],p:[3.45,-3.35],ry:Math.PI},

function placeAt(spot,instant){
  if(!G) return;
  const sp=SPOT3[spot]||SPOT3.window;
  if(instant){G.p.g.position.set(sp.p[0],0,sp.p[1]);G.p.g.rotation.y=sp.ry;G.walk={path:[],sit:!!sp.sit,ry:sp.ry,dest:spot};G.spot=spot;return;}
  if(G.spot===spot) return;
  const path=[];const from=G.spot;
  if(from==='sofa') path.push([1.0,-1.95],[3.0,-1.95]);
  if(from==='window') path.push([3.45,-1.9]);
  path.push([.4,.7]);
  sp.path.forEach(q=>path.push(q));
  G.walk={path,sit:false,ry:sp.ry,dest:spot,finalSit:!!sp.sit};
  G.spot=spot;
}
const lerp=(a,b,k)=>a+(b-a)*Math.min(1,Math.max(0,k));
function lerpAng(a,b,k){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*k;}
function animPerson(dt){
  const p=G.p,w=G.walk,t=G.t,pos=p.g.position;
  const tired=s.hp<40||s.mor<30;
  p.aL.band.visible=s.hp<70;
  if(w.path.length){
    const [tx,tz]=w.path[0];const dx=tx-pos.x,dz=tz-pos.z,dist=Math.hypot(dx,dz);
    const v=(tired?1.5:2.1)*dt;
    if(dist<=v){pos.x=tx;pos.z=tz;w.path.shift();if(!w.path.length&&w.finalSit){w.sit=true;pos.z=SPOT3.sofa.p[1];}}
    else{pos.x+=dx/dist*v;pos.z+=dz/dist*v;p.g.rotation.y=lerpAng(p.g.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*10));}
    const sn=Math.sin(t*(tired?6.5:8.5));
    p.L.hip.rotation.x=sn*.5;p.R.hip.rotation.x=-sn*.5;p.L.knee.rotation.x=Math.max(0,-sn)*.7;p.R.knee.rotation.x=Math.max(0,sn)*.7;
    p.aL.sh.rotation.x=-sn*.4;p.aR.sh.rotation.x=sn*.4;p.aL.el.rotation.x=-.25;p.aR.el.rotation.x=-.25;
    pos.y=Math.abs(Math.cos(t*(tired?6.5:8.5)))*.03;

      p.L.hip.rotation.x=lerp(p.L.hip.rotation.x,-1.5,dt*8);p.R.hip.rotation.x=lerp(p.R.hip.rotation.x,-1.45,dt*8);
      p.L.knee.rotation.x=lerp(p.L.knee.rotation.x,1.45,dt*8);p.R.knee.rotation.x=lerp(p.R.knee.rotation.x,1.35,dt*8);
      p.aL.sh.rotation.x=lerp(p.aL.sh.rotation.x,-.35,dt*6);p.aR.sh.rotation.x=lerp(p.aR.sh.rotation.x,-.45,dt*6);
      p.aL.el.rotation.x=lerp(p.aL.el.rotation.x,-1.0,dt*6);p.aR.el.rotation.x=lerp(p.aR.el.rotation.x,-1.1,dt*6);

function loop(){

  const dt=Math.min(.05,G.clock.getDelta());G.t+=dt;const t=G.t;

  c.hemi=lerp(c.hemi,cfg.hemi*(T.rain?.8:1),k);G.hemi.intensity=c.hemi;G.hemi.color.copy(c.top).lerp(new THREE.Color(0xffffff),.4);
  c.amb=lerp(c.amb,cfg.amb,k);G.amb.intensity=c.amb;
  const sunPos={morning:[-30,10],noon:[2,32],evening:[28,14],dusk:[40,4],night:[24,26]}[T.st];
  G.sun.position.set(sunPos[0]*.22+4,Math.max(2.5,sunPos[1]*.32),-16);
  G.fireLight.intensity=c.glow*(dark?.55:.15)*(.85+Math.sin(t*3.1)*.1+Math.sin(t*7.3)*.05)+(T.fire?.35:0);
  G.bounce.intensity=c.si*.42;G.bounce.color.copy(c.bot).lerp(new THREE.Color(0xffffff),.5);
  G.moon.visible=night&&!T.rain;G.stars.material.opacity=lerp(G.stars.material.opacity,night&&!T.rain?.85:0,k);

  c.lit=lerp(c.lit,T.power?(night?1.4:T.st==='dusk'?.7:0):(night?.15:0),k);G.cityM.forEach(m=>m.emissiveIntensity=c.lit);
  const ff=(dark?3.2:1.4)*(.8+Math.sin(t*5.7)*.12+Math.sin(t*13.1)*.08);G.fireM.forEach(m=>m.emissiveIntensity=ff);
  G.flameSpr.forEach(s=>{const u=s.userData;const f=.75+Math.sin(t*6+u.ph)*.15+Math.sin(t*15.3+u.ph*2)*.1;s.scale.set(u.sz*.7*f,u.sz*1.4*f,1);s.position.y=u.b.y+u.sz*.6*f;s.material.opacity=dark?1:.75;});
  G.fireGlowSpr.forEach((s,i)=>s.material.opacity=(dark?.55:.18)*(.85+Math.sin(t*4+i)*.15));
  G.smokeSpr.forEach(s=>{const u=s.userData;const ph=(u.ph+t*u.sp)%1;s.position.set(u.f.x+ph*14*u.drift,u.f.y+2+ph*45,u.f.z-ph*4);const sc=3+ph*20;s.scale.set(sc,sc,1);s.material.opacity=Math.sin(Math.min(1,ph*1.2)*Math.PI)*(dark?.5:.65);s.material.color.setHex(dark?0x1a1614:0x3a3532);});
  (G.blinkers||[]).forEach(b=>{b.visible=Math.sin(t*2.5+b.userData.blink)>.6;});
  G.search.forEach((p,i)=>{p.visible=dark;p.rotation.z=Math.sin(t*.25+p.userData.ph)*.6;p.rotation.x=Math.cos(t*.2+p.userData.ph)*.35-.1;});
  // interior lamp: unstable grid flicker

  const fl=.85+Math.sin(t*13)*.08+Math.sin(t*23.7)*.06+Math.sin(t*7.1)*.04;
  c.candle=lerp(c.candle,T.candle?(dark?1:.35):0,k);G.candleLight.intensity=c.candle*1.5*fl;

function personScreen(){

function stage(){

function buildTower(){
  let r='';
  const top=24,fh=7;
  r+=`<text x="46" y="12" text-anchor="middle" font-size="10" fill="#9ba5bd" font-family="Atkinson Hyperlegible, sans-serif">ÇATI</text>`;
  r+=`<rect x="22" y="16" width="48" height="6" rx="1" fill="${s.sos?'#9cc46f':'#36425f'}"/>`;
  if(s.sos) r+=`<text x="46" y="21.5" text-anchor="middle" font-size="6" font-weight="700" fill="#141a29" font-family="sans-serif">SOS</text>`;
  for(let f=30;f>=1;f--){const y=top+(30-f)*fh;
    const me=f===30,fire=s.fire&&f===11;
    r+=`<rect x="22" y="${y}" width="48" height="${fh-1.5}" fill="${me?'#f2b45a':fire?'#e0614b':'#2a3452'}"/>`;
    if(me) r+=`<text x="74" y="${y+6}" font-size="9" fill="#f2b45a" font-family="Atkinson Hyperlegible, sans-serif">sen</text>`;
    if(fire) r+=`<text x="74" y="${y+6}" font-size="9" fill="#e0614b" font-family="Atkinson Hyperlegible, sans-serif">11</text>`;
  }
  r+=`<text x="10" y="${top+5}" font-size="8" fill="#9ba5bd" text-anchor="middle" font-family="sans-serif">30</text>`;
  r+=`<text x="10" y="${top+29*fh+5}" font-size="8" fill="#9ba5bd" text-anchor="middle" font-family="sans-serif">1</text>`;
  $('#tower').innerHTML=`<svg viewBox="0 0 92 ${top+30*fh+4}">${r}</svg>`;
}

  const box=$('#actions');box.innerHTML='';
  ACTIONS.forEach(a=>{
    if(a.hidden&&a.hidden()) return;
    const why=(a.why&&a.why())||(s.ap<a.cost?'Yeterli enerjin yok.':null);
    const b=document.createElement('button');b.className='act'+(a.special?' special':'');
    b.disabled=!!why||s.phase!=='day';
    b.innerHTML=`<span class="ico">${ICONS[a.id]}</span><span class="txt"><span class="top"><b>${nm(a)}</b><span class="cost">${a.cost?'●'.repeat(a.cost):'ücretsiz'}</span></span><span class="d">${ds(a)}</span>${why?`<span class="no">${why}</span>`:''}</span>`;

}

/* ---------- save / start ---------- */
function save(){ if(s.phase!=='day'&&s.phase!=='end') return; try{localStorage.setItem(SAVE_KEY,JSON.stringify(s))}catch(e){} }
function restart(){ try{localStorage.removeItem(SAVE_KEY)}catch(e){} s=fresh(); render(); intro(); }
function intro(){
  modal({eyebrow:'Gün 1 · sabah',title:'Salgın başladı',art:peepSVG(2),
    body:`<p>Telefonundaki acil durum uyarısıyla uyandın. Şehirde ısırılanlar birkaç saat içinde başkalarına saldırıyor. Asansörler durdu, koridorda onlardan biri dolaşıyor.</p>
    <p>Sen bir apartmanın <b>30. katında</b>, kendi dairende mahsur kaldın. Elindekiler: biraz yemek, birkaç şişe su ve evdeki eşyalar.</p>
    <p class="hint">Her gün 3 enerjinle eylem seç. Akşam ne kadar yiyip içeceğine karar ver. Gece olaylarına hazırlıklı ol. <b>30 gün</b> dayan.</p>`,
    choices:[{label:'Hayatta kalmaya başla',primary:true,fn:()=>{s.phase='day';log('Kapıyı kilitledin. Musluklar hâlâ akıyor, elektrik var. Ne kadar süreceğini bilmiyorsun.','story');save();render();}}]});
}
function start(data){
  build3D();
  let loaded=null;
  if(data&&data.s) loaded=data.s;
  else { try{const raw=localStorage.getItem(SAVE_KEY); if(raw) loaded=JSON.parse(raw);}catch(e){} }
  s=loaded&&loaded.day?Object.assign(fresh(),loaded):fresh();
  if(s.phase==='ration'||s.phase==='event') s.phase='day';
  render();
  if(s.phase==='intro') intro();
  else if(s.phase==='end'){ s.ending==='lose'?lose():win(); }
}
$('#endDay').onclick=endDay;
let armed=false;
$('#restart').onclick=()=>{const b=$('#restart');
  if(!armed){armed=true;b.textContent='Emin misin? Tekrar bas';b.classList.add('warn');setTimeout(()=>{armed=false;b.textContent='Baştan başla';b.classList.remove('warn')},3000);return;}
  armed=false;b.textContent='Baştan başla';b.classList.remove('warn');$('#modalRoot').innerHTML='';restart();};
window.claude?.hot?.snapshot?.(()=>({s:(s&&(s.phase==='day'||s.phase==='end'))?s:null}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
